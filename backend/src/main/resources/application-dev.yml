server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/personal_blog?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: redis
    port: 6379
    database: 0
    timeout: 3000ms

jwt:
  secret: personalBlogSecretKeyForJWT2024MustBeLongEnough
  expiration: 7200000
  header: Authorization
  prefix: Bearer

file:
  upload-path: /app/uploads
  max-size: 10485760

rate-limit:
  enabled: true
  default-limit: 100
